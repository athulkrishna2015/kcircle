<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2a35"/>
      <stop offset="100%" stop-color="#141319"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#8ec5ff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#5aa8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- the selection stroke, matching the in-app glow -->
  <path d="M40 78 C 36 56, 54 36, 76 38 C 96 40, 104 60, 96 78"
        fill="none" stroke="#7cb8ff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"
        opacity=".38" filter="url(#glow)"/>
  <path d="M40 78 C 36 56, 54 36, 76 38 C 96 40, 104 60, 96 78"
        fill="none" stroke="#ffffff" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>

  <!-- the spark riding the leading edge -->
  <circle cx="96" cy="78" r="13" fill="url(#spark)"/>
  <circle cx="96" cy="78" r="4.5" fill="#ffffff"/>
</svg>
[project]
name = "kcircle"
version = "0.1.0"
description = "Circle to Search for KDE Plasma on Wayland"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6",
    "PyQt6-WebEngine",
    "chrome-lens-py",
    # Imported directly for capture, masking, edge detection and cropping.
    # It resolves today only because chrome-lens-py happens to depend on it;
    # relying on that transitive edge would break the core path silently.
    "Pillow",
]

[project.scripts]
kcircle = "kcircle:main"

# Optional extras. None of these are needed for circling, tapping or text
# search - they only add a decoder on top of what already works.
[project.optional-dependencies]
qr = ["zxing-cpp>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["kcircle.py", "kcircle.desktop"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
[project]
name = "kcircle"
version = "0.1.0"
description = "Circle to Search for KDE Plasma on Wayland"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6",
    "PyQt6-WebEngine",
    "chrome-lens-py",
]

[project.scripts]
kcircle = "kcircle:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["kcircle.py", "kcircle.desktop"]
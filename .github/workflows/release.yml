name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tarball:
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tarball
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          name="kcircle-${ver}-linux-${{ matrix.arch }}"
          mkdir -p "$name"
          cp kcircle kcircle.py kcircle.desktop kcircle.svg LICENSE README.md requirements.txt pyproject.toml "$name"/
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: kcircle-tarball-${{ matrix.arch }}
          path: kcircle-*-linux-${{ matrix.arch }}.tar.gz

  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build AppImage
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          out="kcircle-${ver}-x86_64.AppImage"

          # The tool is downloaded into its own directory so the artifact glob
          # below cannot pick it up. It was previously uploaded as a release
          # asset - a 8.6 MB AppImageKit download, while the actual AppImage
          # was never produced because its failure was swallowed by "|| true".
          mkdir -p tools && cd tools
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          cd ..

          # A PyQt6 app needs its interpreter and wheels inside the image.
          # A launcher that called the system python3 produced an AppImage
          # which could not import PyQt6 on any machine.
          export UV_LINK_MODE=copy
          uv venv "$PWD/AppDir/venv" --python 3.12
          uv pip install --python "$PWD/AppDir/venv/bin/python" \
            -r requirements.txt

          mkdir -p AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/scalable/apps
          cp kcircle.py AppDir/usr/bin/kcircle.py
          cp kcircle.desktop AppDir/usr/share/applications/
          cp kcircle.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          cat > AppDir/AppRun <<'RUNNER'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          if [[ -z "${QT_QPA_PLATFORM:-}" && -n "${WAYLAND_DISPLAY:-}" ]]; then
            export QT_QPA_PLATFORM=wayland
          fi
          exec "$HERE/venv/bin/python" "$HERE/usr/bin/kcircle.py" "$@"
          RUNNER
          chmod +x AppDir/AppRun

          ./tools/appimagetool-x86_64.AppImage AppDir "$out"
          test -s "$out" || { echo "::error::AppImage was not produced"; exit 1; }
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: kcircle-appimage
          # kcircle-*.AppImage only - never the AppImageKit build tool.
          path: 'kcircle-*.AppImage'

  release:
    needs: [build-tarball, build-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          # Exclude the checksum file itself, or sha256sum races its own output.
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true



name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tarball:
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tarball
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          name="kcircle-${ver}-linux-${{ matrix.arch }}"
          mkdir -p "$name"
          cp kcircle kcircle.py kcircle.desktop kcircle.svg LICENSE README.md requirements.txt pyproject.toml "$name"/
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: kcircle-tarball-${{ matrix.arch }}
          path: kcircle-*-linux-${{ matrix.arch }}.tar.gz

  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          pip install pyinstaller
          pyinstaller --onefile --name kcircle kcircle.py || true
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp kcircle AppDir/usr/bin/ 2>/dev/null || true
          cp kcircle.py AppDir/usr/bin/kcircle.py
          cp kcircle.desktop AppDir/usr/share/applications/
          cp kcircle.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          printf '%s\n' '#!/bin/bash' 'exec python3 /usr/bin/kcircle.py "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          ./appimagetool-x86_64.AppImage AppDir "kcircle-${ver}-x86_64.AppImage" || true
      - uses: actions/upload-artifact@v4
        with:
          name: kcircle-appimage
          path: '*.AppImage'

  release:
    needs: [build-tarball, build-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true

